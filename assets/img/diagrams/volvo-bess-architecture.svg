<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Volvo Penta BESS Electric Machine Platform - Control Architecture</title>
  <desc id="desc">
    Modular control architecture for HMI-driven crusher operations, interlocked conveyors, energy management, and resilient runtime governance.
  </desc>
  <defs>
    <style>
      .bg{fill:#0d1324}.cluster{fill:#141f36;stroke:#2f456c;stroke-width:2;rx:12}.title{fill:#edf3ff;font:700 24px &apos;Segoe UI&apos;,Arial}.sub{fill:#a6bbde;font:600 16px &apos;Segoe UI&apos;,Arial}.node{fill:#1d2c4a;stroke:#4f7bbc;stroke-width:2;rx:8}.iface{fill:#183652;stroke:#3ab4da;stroke-width:2;rx:8}.text{fill:#dae6fb;font: 600 16.5px &apos;Segoe UI&apos;,Arial}.flow{stroke:#7fb2e2;stroke-width: 2;fill:none;marker-end:url(#a)}.sync{stroke:#47c9e0;stroke-width: 2;fill:none;marker-end:url(#b)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb2e2"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#47c9e0"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="860"/>
  <text x="40" y="48" class="title">Volvo Penta BESS - Control and Energy Architecture</text>
  <text x="40" y="74" class="sub">HMI governance and microgrid-aware execution</text>
  <rect class="cluster" x="32" y="100" width="520" height="730"/>
  <text x="52" y="132" class="title">Operations and Interface Layer</text>
  <rect class="iface" x="60" y="170" width="460" height="70"/>
  <text x="78" y="204" class="text"><tspan x="78" dy="0">Rugged HMI and</tspan><tspan x="78" dy="18">Operator Control Surfaces</tspan></text>
  <rect class="node" x="60" y="262" width="460" height="70"/>
  <text x="78" y="294" class="text"><tspan x="78" dy="0">Command Validation and</tspan><tspan x="78" dy="18">Safety Envelope</tspan></text>
  <rect class="node" x="60" y="354" width="460" height="70"/>
