  <rect class="node" x="60" y="446" width="460" height="70"/>
  <text x="78" y="478" class="text"><tspan x="78" dy="0">Conveyor and Feeder</tspan><tspan x="78" dy="18">Interlocking Controller</tspan></text>
  <rect class="node" x="60" y="538" width="460" height="70"/>
