  <rect class="node" x="612" y="170" width="350" height="70"/>
  <text x="628" y="202" class="text"><tspan x="628" dy="0">PLC and Automation</tspan><tspan x="628" dy="18">Integration Bus</tspan></text>
  <rect class="node" x="996" y="170" width="340" height="70"/>
