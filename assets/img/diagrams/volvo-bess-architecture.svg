  <rect class="node" x="996" y="446" width="340" height="70"/>
  <text x="1010" y="478" class="text"><tspan x="1010" dy="0">Audit Logging and</tspan><tspan x="1010" dy="18">Incident Replay</tspan></text>
  <rect class="node" x="612" y="538" width="724" height="70"/>
  <text x="628" y="570" class="text"><tspan x="628" dy="0">Release Governance and</tspan><tspan x="628" dy="18">Policy Enforcement</tspan></text>
  <line class="sync" x1="962" y1="205" x2="996" y2="205"/>
  <line class="sync" x1="962" y1="297" x2="996" y2="297"/>
