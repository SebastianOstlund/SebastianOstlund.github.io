" dy="18">Version Control</tspan></text><rect class="node" x="360" y="354" width="280" height="70"/><text x="382" y="396" class="text">Compliance and Quality Gate</text><rect class="node" x="60" y="446" width="580" height="70"/><text x="82" y="488" class="text">Deployment Channel Management</text><line class="flow" x1="200" y1="240" x2="200" y2="262"/><line class="flow" x1="500" y1="240" x2="500" y2="262"/><line class="flow" x1="200" y1="332" x2="200" y2="354"/><line class="flow" x1="500" y1="332" x2="500" y2="354"/><line class="flow" x1="200" y1="424" x2="200" y2="446"/><line class="flow" x1="500" y1="424" x2="500" y2="446"/><rect class="cluster" x="704" y="100" width="664" height="730"/><text x="724" y="132" class="title">Runtime and Performance Domain</text><rect class="node" x="732" y="170" width="300" height="70"/><text x="754" y="212" class="text">Headset Runtime Controller</text><rect class="node" x="1048" y="170" width="292" height="70"/><text x="1070" y="212" class="text">Interaction and Input Adapter</text><rect class="node" x="732" y="262" width="300" height="70"/><text x="754" y="304" class="text">Scenario Execution Engine</text><rect class="node" x="1048" y="262" width="292" height="70"/><text x="1070" y="304" class="text">State Persistence and Resume</text><rect class="iface" x="732" y="354" width="608" height="70"/><text x="742" y="386" class="text"><tspan x="742" dy="0">Telemetry and Learning</tspan><tspan x="742" dy="18">Analytics Interface</tspan></text><rect class="node" x="732" y="446" width="608" height="70"/><text x="754" y="488" class="text">Scalability Layer</text><rect class="node" x="732" y="538" width="608" height="70"/><text x="754" y="580" class="text">Interface Contract Layer</text><line class="flow" x1="1032" y1="205" x2="1048" y2="205"/><line class="flow" x1="1032" y1="297" x2="1048" y2="297"/><line class="flow" x1="882" y1="240" x2="882" y2="262"/><line class="flow" x1="1194" y1="240" x2="1194" y2="262"/><line class="flow" x1="882" y