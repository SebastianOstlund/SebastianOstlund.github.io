<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Architecture placeholder diagram</title>
  <desc id="desc">Placeholder architecture diagram with layered components and data flow arrows.</desc>
  <defs>
	<style>
	  .bg { fill: #0f1424; }
	  .panel { fill: #1a233a; stroke: #34486e; stroke-width: 3; rx: 12; }
	  .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #ecf3ff; }
	  .text { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #c8d5ef; }
	  .line { stroke: #66b6da; stroke-width: 5; marker-end: url(#arrow); }
	</style>
	<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
	  <path d="M 0 0 L 10 5 L 0 10 z" fill="#66b6da" />
	</marker>
  </defs>

  <rect class="bg" width="1200" height="700" />
  <text class="title" x="56" y="86">Architecture Diagram Placeholder</text>

  <rect class="panel" x="80" y="150" width="300" height="110" />
  <text class="text" x="122" y="216">Presentation</text>

  <rect class="panel" x="450" y="150" width="300" height="110" />
  <text class="text" x="503" y="216">Application</text>

  <rect class="panel" x="820" y="150" width="300" height="110" />
  <text class="text" x="894" y="216">Domain</text>

  <rect class="panel" x="450" y="360" width="300" height="110" />
  <text class="text" x="520" y="426">Data Layer</text>

  <line class="line" x1="380" y1="205" x2="450" y2="205" />
  <line class="line" x1="750" y1="205" x2="820" y2="205" />
  <line class="line" x1="600" y1="260" x2="600" y2="360" />
</svg>



