<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">GCC/LLVM Toolchain and VM - Architecture</title><desc id="desc">Compiler and virtual-machine architecture with deterministic execution, multi-target backend support, and zero-allocation runtime design.</desc><defs><style>.bg{fill:#0d1324}.cluster{fill:#141f36;stroke:#2f456c;stroke-width:2;rx:12}.title{fill:#edf3ff;font:700 24px 'Segoe UI',Arial}.sub{fill:#a6bbde;font:600 16px 'Segoe UI',Arial}.node{fill:#1d2c4a;stroke:#4f7bbc;stroke-width:2;rx:8}.iface{fill:#183652;stroke:#3ab4da;stroke-width:2;rx:8}.text{fill:#dae6fb;font: 600 16.5px 'Segoe UI',Arial}.flow{stroke:#7fb2e2;stroke-width: 2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7fb2e2"/></marker></defs><rect class="bg" width="1400" height="860"/><text x="40" y="48" class="title">GCC/LLVM Toolchain and Custom VM - Execution Architecture</text><text x="40" y="74" class="sub">Modular compilation and predictable runtime behavior</text><rect class="cluster" x="32" y="100" width="640" height="730"/><text x="52" y="132" class="title">Compilation and IR Domain</text><rect class="iface" x="60" y="170" width="580" height="70"/><text x="82" y="212" class="text">Source Intake Interface</text><rect class="node" x="60" y="262" width="280" height="70"/><text x="78" y="294" class="text"><tspan x="78" dy="0">Front-End Parsing and</tspan><tspan x="78" dy="18">Semantic Analysis</tspan></text><rect class="node" x="360" y="262" width="280" height="70"/><text x="372" y="294" class="text"><tspan x="372" dy="0">Intermediate</tspan><tspan x="372" dy="18">Representation (IR) Layer</tspan></text><rect class="node" x="60" y="354" width="280" height="70"/><text x="78" y="386" class="text"><tspan x="78" dy="0">Optimization and</tspan><tspan x="78" dy="18">Scheduling Passes</tspan></text><rect class="node" x="360" y="354" width="280" height="70"/><text x="372" y="386" class="text"><tspan x="372" dy="0">Target Code Generation</tspan><tspan x="372" dy="18">(x86 / MIPS / RISC-V)</tspan></text><rect class="node" x="60" y="446" width="580" height="70"/><text x="78" y="478" class="text"><tspan x="78" dy="0">Artifact Packaging and</tspan><tspan x="78" dy="18">Reproducibility</tspan></text><line class="flow" x1="200" y1="240" x2="200" y2="262"/><line class="flow" x1="500" y1="240" x2="500" y2="262"/><line class="flow" x1="200" y1="332" x2="200" y2="354"/><line class="flow" x1="500" y1="332" x2="500" y2="354"/><line class="flow" x1="200" y1="424" x2="200" y2="446"/><line class="flow" x1="500" y1="424" x2="500" y2="446"/><rect class="cluster" x="704" y="100" width="664" height="730"/><text x="724" y="132" class="title">Runtime and Verification Domain</text><rect class="node" x="732" y="170" width="300" height="70"/><text x="742" y="202" class="text"><tspan x="742" dy="0">Instruction Decoder and</tspan><tspan x="742" dy="18">Dispatch Core</tspan></text><rect class="node" x="1048" y="170" width="292" height="70"/><text x="1062" y="202" class="text"><tspan x="1062" dy="0">Execution Engine</tspan><tspan x="1062" dy="18">(Deterministic Tick)</tspan></text><rect class="node" x="732" y="262" width="300" height="70"/><text x="754" y="304" class="text">Zero-Allocation Memory Manager</text><rect class="node" x="1048" y="262" width="292" height="70"/><text x="1070" y="304" class="text">Register and State Model</text><rect class="iface" x="732" y="354" width="608" height="70"/><text x="742" y="386" class="text"><tspan x="742" dy="0">Debug and Trace Interface</tspan><tspan x="742" dy="18">(Execution Introspection)</tspan></text><rect class="node" x="732" y="446" width="608" height="70"/><text x="742" y="478" class="text"><tspan x="742" dy="0">Correctness Harness and</tspan><tspan x="742" dy="18">Performance Validation Layer</tspan></text><line class="flow" x1="1032" y1="205" x2="10