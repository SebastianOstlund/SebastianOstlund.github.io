<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Volvo Penta Port Simulator - Architecture</title>
  <desc id="desc">
    Scenario-driven modular simulator with vehicle physics, driver-assist modeling, and training analytics.
  </desc>
  <defs>
    <style>
      .bg{fill:#0d1324}.cluster{fill:#141f36;stroke:#2f456c;stroke-width:2;rx:12}.title{fill:#edf3ff;font:700 24px &apos;Segoe UI&apos;,Arial}.sub{fill:#a6bbde;font:600 16px &apos;Segoe UI&apos;,Arial}.node{fill:#1d2c4a;stroke:#4f7bbc;stroke-width:2;rx:8}.iface{fill:#183652;stroke:#3ab4da;stroke-width:2;rx:8}.text{fill:#dae6fb;font: 600 16.5px &apos;Segoe UI&apos;,Arial}.flow{stroke:#7fb2e2;stroke-width: 2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb2e2"/>
    </marker>
